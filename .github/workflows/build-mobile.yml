name: Build mobile

# MANUEL UNIQUEMENT (pas à chaque push, pour maîtriser le coût des builds EAS).
# Profil selon la branche sur laquelle on lance le run :
#   - main            → production (APK Android signé + iOS simulateur)
#   - develop / autre → preview    (APK Android + iOS simulateur)
# Binaires buildés par EAS (cloud) puis déposés dans les ARTEFACTS GitHub.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateformes à builder (android seul = 2× moins cher)'
        type: choice
        options: [all, android, ios]
        default: all

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Profil selon la branche
        id: p
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "profile=production" >>"$GITHUB_OUTPUT"
          else
            echo "profile=preview" >>"$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4 # version lue depuis package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # Build cloud EAS des 2 plateformes, on attend la fin et on récupère le JSON.
      - name: EAS build (${{ steps.p.outputs.profile }})
        working-directory: apps/mobile
        run: |
          eas build --platform "${{ inputs.platform }}" --profile "${{ steps.p.outputs.profile }}" \
            --non-interactive --wait --json > builds.json
          echo "Builds terminés :"
          jq -r '.[] | "  \(.platform): \(.artifacts.applicationArchiveUrl)"' builds.json

      - name: Télécharger les binaires
        working-directory: apps/mobile
        run: |
          mkdir -p artifacts
          A_URL="$(jq -r '.[] | select(.platform=="ANDROID") | .artifacts.applicationArchiveUrl // empty' builds.json)"
          I_URL="$(jq -r '.[] | select(.platform=="IOS") | .artifacts.applicationArchiveUrl // empty' builds.json)"
          if [ -n "$A_URL" ]; then
            curl -fL "$A_URL" -o "artifacts/vitrine-${{ steps.p.outputs.profile }}-android.apk"
          fi
          if [ -n "$I_URL" ]; then
            curl -fL "$I_URL" -o "artifacts/vitrine-${{ steps.p.outputs.profile }}-ios-simulator.tar.gz"
          fi
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: vitrine-mobile-${{ steps.p.outputs.profile }}-${{ github.sha }}
          path: apps/mobile/artifacts/*
          retention-days: 30
          if-no-files-found: error
